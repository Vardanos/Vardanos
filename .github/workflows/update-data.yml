name: Update data

on:
  schedule:
    - cron: "17 3 * * 1"  # weekly, Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      from_year:
        description: "First publication year to (re)harvest; leave empty for the current and previous year"
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - name: Institutions (ROR)
        run: python -m armenia_science institutions
      - name: Works (OpenAlex)
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
        run: |
          FROM="${{ inputs.from_year }}"
          [ -z "$FROM" ] && FROM=$(( $(date +%Y) - 1 ))
          python -m armenia_science works --from-year "$FROM"
      - name: Statistics
        run: python -m armenia_science stats
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data STATS.md
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%d)"
          git push
